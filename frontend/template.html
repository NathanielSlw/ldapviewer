<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>{page_title}</title>
    <style>
        {style_content}
    </style>
    <script>
        {script_content}
    </script>
</head>
<body>
    <!-- Header with title and toggle theme -->
    <div class="header-container">
        <h1>LDAP Viewer - {filename}</h1>
        <div class="header-actions">
            <a href="https://github.com/NathanielSlw/ldapviewer" target="_blank" class="github-link" title="View on GitHub">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                </svg>
                
            </a>
            <div class="toggle-buttons-group">
                <button class="toggle-button view-toggle" onclick="toggleMinimalView()" title="Toggle minimal view - Show only essential columns">
                
                <span class="toggle-icon left full-icon">➕</span>
                <span class="toggle-icon right minimal-icon">➖</span>
                <div class="toggle-slider">
                    <span class="slider-icon-minimal">➕</span>
                </div>
            </button>

            <button class="toggle-button theme-toggle" onclick="toggleTheme()" title="Toggle theme">
                <span class="toggle-icon left sun-icon">🔆</span>
                <span class="toggle-icon right moon-icon">🌙​</span>
                <div class="toggle-slider">
                    <span class="slider-icon">🔆</span>
                </div>
            </button>
            </div>
        </div>
    </div>

    <div class="controls">
        <!-- Menu -->
        <div class="main-menu">
            <button onclick="switchView('detail')">
                📋 Detail View
            </button>
            <button onclick="switchView('table')">
                📊 Table View
            </button>
            <button onclick="switchView('stats')">
                📈 Statistics
            </button>
            <!-- <button onclick="exportCSV()">
                💾 Export to CSV
            </button> -->
        </div>
        
        <!-- Sub-menu to expand/collapse -->
        <div class="sub-menu" id="detailButtons">
            <button id="expandBtn" onclick="toggleAll(true)">Expand All</button>
            <button id="collapseBtn" onclick="toggleAll(false)">Collapse All</button>
            <button id="groupByBtn" onclick="toggleUsersByGroups()">👥 Users by Group</button>
        </div>

        <!-- Table-specific buttons (only shown in table view) -->
        <div class="sub-menu" id="tableButtons" style="display: none;">
            <button id="exportBtn" onclick="exportCSV()">
                💾 Export to CSV
            </button>
        </div>
        
        <!-- Search bar -->
         <div class="search-container">
            <input type="text" id="searchInput" onkeyup="filterEntries()" oninput="toggleClearButton()" placeholder="Search LDAP object : username, email, etc." autofocus>
            <span class="search-icon">🔍</span>
            <button class="clear-search" id="clearSearchBtn" onclick="clearSearch()" title="Clear search">×</button>
        </div>
        <!-- <input type="text" id="searchInput" onkeyup="filterEntries()" placeholder="🔍 Search LDAP object : username, email, etc." autofocus> -->

        <!-- Filter Sections -->
        <div class="filter-bar">
            <div class="active-filters">
                <span class="filter-label">Active Filters:</span>
                <div id="activeFilterChips"></div>
            </div>
            
            <div class="filter-dropdown">
                <button class="filter-button" onclick="toggleFilterDropdown()">
                    <span>🔍 Filters</span>
                    <span class="filter-count" id="filterCount">0</span>
                    <span class="dropdown-arrow">▼</span>
                </button>
                
                <div class="filter-menu" id="filterMenu">
                    <div class="filter-tabs">
                        <button class="filter-tab active" onclick="switchFilterTab('uac')">🛡️ UAC</button>
                        <button class="filter-tab" onclick="switchFilterTab('ldap')">🔍 LDAP</button>
                        <button class="filter-tab" onclick="switchFilterTab('general')">⚙️ General</button>
                    </div>
                    
                    <div class="filter-content">
                        <!-- UAC Tab -->
                        <div id="uacTab" class="filter-tab-content active">
                            <div class="filter-chips-section">
                                <h6>🚨 Security Critical</h6>
                                <div class="filter-chips">
                                    <button class="filter-chip" data-value="2" data-name="DISABLED" onclick="toggleFilterChip(this, 'uac')">
                                        🚫 Account Disabled
                                    </button>
                                    <button class="filter-chip" data-value="2" data-name="ENABLED" data-inverse="true" onclick="toggleFilterChip(this, 'uac')">
                                        ✅ Account Enabled
                                    </button>
                                    <button class="filter-chip" data-value="4194304" data-name="DONT_REQUIRE_PREAUTH" onclick="toggleFilterChip(this, 'uac')">
                                        🔑 No Kerberos PreAuth (ASREProastable)
                                    </button>
                                    <button class="filter-chip" data-value="524288" data-name="TRUSTED_FOR_DELEGATION" onclick="toggleFilterChip(this, 'uac')">
                                        🎭🚀 Unconstrained (KUD)
                                    </button>
                                    <button class="filter-chip" data-value="16777216" data-name="TRUSTED_TO_AUTH_FOR_DELEGATION" onclick="toggleFilterChip(this, 'uac')">
                                        🎭📌 Constrained (KCD w/ Protocol Transition)
                                    </button>
                                    <button class="filter-chip" data-value="1048576" data-name="NOT_DELEGATED" onclick="toggleFilterChip(this, 'uac')">
                                        🛡️ Cannot Be Delegated
                                    </button>
                                </div>
                            </div>
                            
                            <div class="filter-chips-section">
                                <h6>🔐 Password Related</h6>
                                <div class="filter-chips">
                                    <button class="filter-chip" data-value="32" data-name="PASSWORD_NOT_REQUIRED" onclick="toggleFilterChip(this, 'uac')">
                                        🔓 Password Not Required
                                    </button>
                                    <button class="filter-chip" data-value="65536" data-name="DONT_EXPIRE_PASSWORD" onclick="toggleFilterChip(this, 'uac')">
                                        ⏰ Password Never Expires
                                    </button>
                                    <button class="filter-chip" data-value="64" data-name="PASSWD_CANT_CHANGE" onclick="toggleFilterChip(this, 'uac')">
                                        🔒 User Cannot Change Password
                                    </button>
                                    <button class="filter-chip" data-value="8388608" data-name="PASSWORD_EXPIRED" onclick="toggleFilterChip(this, 'uac')">
                                        ⚠️ Password Expired
                                    </button>
                                </div>
                            </div>
                            
                            <div class="filter-chips-section">
                                <h6>🔑 Authentication & Access</h6>
                                <div class="filter-chips">
                                    <button class="filter-chip" data-value="262144" data-name="SMARTCARD_REQUIRED" onclick="toggleFilterChip(this, 'uac')">
                                        💳 Smartcard Required
                                    </button>
                                    <button class="filter-chip" data-value="16" data-name="LOCKOUT" onclick="toggleFilterChip(this, 'uac')">
                                        🔐 Account Locked Out
                                    </button>
                                    <button class="filter-chip" data-value="128" data-name="ENCRYPTED_TEXT_PWD_ALLOWED" onclick="toggleFilterChip(this, 'uac')">
                                        🔐 Reversible Encryption
                                    </button>
                                    <button class="filter-chip" data-value="2097152" data-name="USE_DES_KEY_ONLY" onclick="toggleFilterChip(this, 'uac')">
                                        🔓 Use DES Key Only
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- LDAP Tab -->
                        <div id="ldapTab" class="filter-tab-content">
                            <div class="filter-chips-section">
                                <h6>🚨 Security Critical Attributes</h6>
                                <div class="filter-chips">
                                    <button class="filter-chip" data-attribute="servicePrincipalName" onclick="toggleFilterChip(this, 'ldap')">
                                        🎯 Has SPN (Kerberoastable)
                                    </button>
                                    <button class="filter-chip" data-attribute="adminCount" data-value="1" onclick="toggleFilterChip(this, 'ldap')">
                                        👑 AdminCount = 1
                                    </button>
                                    <button class="filter-chip" data-attribute="msDS-AllowedToDelegateTo" onclick="toggleFilterChip(this, 'ldap')">
                                        🎭📌 Constrained (KCD w/o Protocol Transition)
                                    </button>
                                    <button class="filter-chip" data-attribute="msDS-AllowedToActOnBehalfOfOtherIdentity" onclick="toggleFilterChip(this, 'ldap')">
                                        🎭🧩 RBCD Delegation
                                    </button>
                                    <button class="filter-chip" data-attribute="objectClass" data-contains="msDS-GroupManagedServiceAccount" onclick="toggleFilterChip(this, 'ldap')">
                                        🔑 gMSA Account
                                    </button>
                                    <button class="filter-chip" data-attribute="objectClass" data-contains="msDS-DelegatedManagedServiceAccount" onclick="toggleFilterChip(this, 'ldap')">
                                        🧬 dMSA Account
                                    </button>
                                    <button class="filter-chip" id="lapsReadableChip" onclick="toggleLAPSFilter(this)">
                                        🔓 LAPS Password Readable
                                    </button>
                                    <button class="filter-chip" id="dangerousAclChip" onclick="toggleDangerousACLFilter(this)">
                                        ⚔️ Has Dangerous ACL Grant
                                    </button>
                                    <button class="filter-chip" data-attribute="netbootServer" onclick="toggleFilterChip(this, 'ldap')">
                                        🖧 PXE Boot Server (netbootServer)
                                    </button>
                                    <button class="filter-chip" data-attribute="msSMSSiteCode" onclick="toggleFilterChip(this, 'ldap')">
                                        📦 SCCM Client (msSMSSiteCode)
                                    </button>
                                    <button class="filter-chip" data-attribute="objectClass" data-contains="mSSMSManagementPoint" onclick="toggleFilterChip(this, 'ldap')">
                                        🗄️ SCCM Management Point
                                    </button>
                                    <button class="filter-chip" id="unsupportedOSChip" onclick="toggleUnsupportedOSFilter(this)">
                                        🖥️ Unsupported OS
                                    </button>
                                </div>
                            </div>

                            <div class="filter-chips-section">
                                <h6>📝 Information Disclosure</h6>
                                <div class="filter-chips">
                                    <button class="filter-chip" data-attribute="description" onclick="toggleFilterChip(this, 'ldap')">
                                        📄 Has Description
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- General Tab -->
                        <div id="generalTab" class="filter-tab-content">
                            <div class="filter-chips-section">
                                <h6>⚙️ General Options</h6>
                                <div class="filter-chips">
                                    <button class="filter-chip" id="nonDefaultChip" onclick="toggleGeneralFilter(this, 'nonDefault')">
                                        🛠️ Non-default objects only
                                    </button>
                                    <button class="filter-chip" id="defaultOnlyChip" onclick="toggleGeneralFilter(this, 'default')">
                                        🏛️ Default objects only
                                    </button>
                                    <button class="filter-chip" id="recentlyCreatedChip" onclick="toggleGeneralFilter(this, 'recentlyCreated')">
                                        🕒 Recently Created (30d)
                                    </button>
                                    <button class="filter-chip" id="inactiveAccountsChip" onclick="toggleGeneralFilter(this, 'inactiveAccounts')">
                                        💤 Inactive Accounts (lastLogon&gt;90d)
                                    </button>
                                    <button class="filter-chip" id="neverLoggedInChip" onclick="toggleGeneralFilter(this, 'neverLoggedIn')">
                                        ❌ Never Logged In (logonCount=0)
                                    </button>
                                </div>
                            </div>

                            <div class="filter-chips-section">
                                <h6>👑 Owned Objects</h6>
                                <div class="filter-chips">
                                    <button class="filter-chip" onclick="toggleGeneralFilter(this, 'owned')">
                                        👑 Owned Objects
                                    </button>
                                    <button class="filter-chip" onclick="toggleGeneralFilter(this, 'nonowned')">
                                        🚫 Non-Owned Objects
                                    </button>
                                </div>
                            </div>
                        </div>        
                    </div>
                    
                    <div class="filter-actions">
                        <button class="clear-all-btn" onclick="clearAllFilters()">Clear All</button>
                        <button class="close-filters-btn" onclick="toggleFilterDropdown()">Close</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Results Counter -->
        <div id="resultsCount">0 results / 0 objects</div>
    </div>

    <!-- Main Views -->
    <div id="detailView">
        {detail_content}
    </div>
    <div id="tableView" class="hidden">
        {table_content}
    </div>
    <div id="statsView" class="hidden"> 
       {stats_content}
    </div>
</body>
</html>
